name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The go job builds with -tags stub, which embeds a stub page instead of the built front end,
          # so each side runs on its own files. The embedded prompts and snapshot.js count as Go.
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/prompts/**'
              - 'desktop/browser/**'
              - 'Makefile'
              - 'scripts/go-test-shard.sh'
              - '.github/workflows/ci.yml'
            frontend:
              - 'desktop/frontend/**'
              - '.github/workflows/ci.yml'

  go-test:
    name: Test Go (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    # The runner has no Chrome for Testing; its Google Chrome is no one's default browser.
    env:
      ORCHESTRATOR_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      SHARD: ${{ matrix.shard }} ${{ strategy.job-total }}
    strategy:
      fail-fast: false
      # scripts/go-test-shard.sh says what each shard runs, and refuses a shard count other than its table's.
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The tests' plain agent is bash; macOS's own 3.2 has no bracketed paste, so pasted line breaks would run.
      - run: brew install tmux bash
      # orchestrator writes a file of agent-browser's own, so the pinned version must pass the agent-browser test.
      - name: Install agent-browser on the shard of the browser tests
        run: |
          if scripts/go-test-shard.sh $SHARD list | grep -qx ./desktop/browser; then
            make agent-browser && echo "ORCHESTRATOR_AGENT_BROWSER=$PWD/bin/agent-browser" >> "$GITHUB_ENV"
          fi
      - if: matrix.shard == strategy.job-total
        run: go vet -tags stub ./...
      # -p limits builds too, so compile every package in parallel first, running no tests;
      # the -p 1 step below then finds them in the build cache.
      - run: go test -tags stub -race -run '^$' $(scripts/go-test-shard.sh $SHARD list)
      # -p 1: many packages' tests start a real tmux server, real PTYs or a real headless
      # browser; -p 2 still let a different one of them miss its budget each run on
      # macos-latest's few vCPUs. One package at a time trades minutes for reliability.
      - run: scripts/go-test-shard.sh $SHARD test -tags stub -race -p 1

  # The ruleset on main requires a check by this name.
  go:
    name: Vet and test Go
    needs: [changes, go-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  frontend:
    name: Build front end
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: make desktop-frontend
